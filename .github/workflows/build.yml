name: Build Cometa OS APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes del SDK necesarios
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Dar permisos de ejecución (si existe gradlew)
        run: chmod +x ./gradlew || true

      - name: Compilar APK de Debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cometa-os-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
